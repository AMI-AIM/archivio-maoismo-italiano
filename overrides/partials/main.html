{% extends "base.html" %}

{% block extrahead %}
  <!-- ======================================================
       FONT D'ARCHIVIO (kit armonizzato — bassa dissonanza)
       Fraunces      → titoli E corpo del testo: stessa famiglia,
                        cambia solo peso/dimensione ottica
                        (900 = titoli di sezione, 600 = titoli di
                        riga/scheda, 400 = corpo, italic = date di

       Archivo       → etichette, nav, bottoni, badge — unico

       Courier Prime → SOLO codice e blocchi isolati (mai in riga
                        con altro testo)
       ====================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,400&family=Archivo:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
