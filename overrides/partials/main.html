{% extends "base.html" %}

{% block extrahead %}
  <!-- ======================================================
       FONT D'ARCHIVIO
       Fraunces      → titoli e corpo (stessa famiglia, peso variabile)
       Archivo       → etichette, nav, bottoni
       Courier Prime → codice e blocchi isolati (schede, trascrizioni)
       Material Symbols Outlined → icone UI (bandiera organizzazioni)
       NOTA: icon_names=flag carica SOLO il glifo flag; per aggiungere
       altre icone Material, aggiungerle alla lista icon_names.
       ====================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Archivo:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=flag" />
{% endblock %}
