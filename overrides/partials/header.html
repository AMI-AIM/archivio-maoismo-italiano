<!-- overrides/partials/header.html -->
<!-- Checkbox per il drawer (menu laterale) -->
<input class="md-toggle" data-md-toggle="drawer" type="checkbox" id="__drawer" autocomplete="off">

<header class="md-header" data-md-component="header">
  <div class="md-header__inner md-grid">

    <!-- Pulsante hamburger (visibile solo su mobile) -->
    <label class="md-header__button md-icon" for="__drawer" aria-label="Menu" id="hamburger-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/>
      </svg>
    </label>

    <!-- LOGO a sinistra -->
    <a href="{{ config.site_url | default(nav.homepage.url, true) | url }}"
       title="{{ config.site_name | e }}"
       class="md-header__button md-logo"
       aria-label="{{ config.site_name }}">
      {% include "partials/logo.html" %}
    </a>

    <!-- NAVIGAZIONE a destra (desktop) -->
    <nav class="md-header__nav" aria-label="Navigazione">
      <ul class="md-header__nav-list">
        {% for nav_item in nav %}
          <li class="md-header__nav-item">
            <a href="{{ nav_item.url | url }}"
               class="md-header__nav-link{% if nav_item.active %} md-header__nav-link--active{% endif %}">
              {{ nav_item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

  </div>
</header>

<!-- OVERLAY (cliccandolo chiude il drawer) -->
<label class="md-drawer-overlay" for="__drawer" id="drawer-overlay"></label>

<!-- DRAWER PERSONALIZZATO (menu laterale) -->
<div class="md-drawer" id="custom-drawer" role="navigation" aria-label="Navigazione mobile">
  <div class="md-drawer__inner">
    
    <!-- INTESTAZIONE ROSSA CON LOGO -->
    <div class="md-drawer__header">
      <a href="{{ config.site_url | default(nav.homepage.url, true) | url }}"
         class="md-drawer__logo-link"
         aria-label="{{ config.site_name }}">
        <img src="{{ config.theme.logo | url }}" 
             alt="{{ config.site_name }}" 
             class="md-drawer__logo">
      </a>
    </div>

    <!-- VOCI DI NAVIGAZIONE -->
    <ul class="md-drawer__list">
      {% for nav_item in nav %}
        <li class="md-drawer__item">
          <a href="{{ nav_item.url | url }}"
             class="md-drawer__link{% if nav_item.active %} md-drawer__link--active{% endif %}">
            {{ nav_item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>
