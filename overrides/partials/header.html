<!-- overrides/partials/header.html -->

<!-- Checkbox nascosto richiesto da Material per aprire/chiudere il pannello di ricerca -->
<input class="md-toggle" data-md-toggle="search" type="checkbox" id="__search" autocomplete="off">

<header class="md-header" data-md-component="header">
  <div class="md-header__inner md-grid">

    <!-- LOGO a sinistra -->
    <a href="{{ config.site_url | default(nav.homepage.url, true) | url }}"
       title="{{ config.site_name | e }}"
       class="md-header__button md-logo"
       aria-label="{{ config.site_name }}">
      {% include "partials/logo.html" %}
    </a>

    <!-- NAVIGAZIONE al centro (unica) -->
    <nav class="md-header__nav" aria-label="Navigazione">
      <ul class="md-header__nav-list">
        {% for nav_item in nav %}
          <li class="md-header__nav-item">
            <a href="{{ nav_item.url | url }}"
               class="md-header__nav-link{% if nav_item.active %} md-header__nav-link--active{% endif %}">
              {{ nav_item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- RICERCA a destra (sempre visibile) -->
    <div class="md-header__search">
      <div class="md-search" data-md-component="search" role="dialog">
        <label class="md-search__overlay" for="__search"></label>
        <div class="md-search__inner" role="search">
          <form class="md-search__form" name="search">
            <input type="text"
                   class="md-search__input"
                   name="query"
                   id="__search-input"
                   aria-label="Cerca"
                   placeholder="Cerca"
                   autocapitalize="off"
                   autocorrect="off"
                   autocomplete="off"
                   spellcheck="false"
                   data-md-component="search-query"
                   required>
            <label class="md-search__icon md-icon" for="__search">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5z"/>
              </svg>
            </label>
            <nav class="md-search__options" aria-label="Opzioni di ricerca">
              <button type="reset" class="md-search__icon md-icon" tabindex="-1" aria-label="Cancella">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
              </button>
            </nav>
            <div class="md-search__suggest" data-md-component="search-suggest"></div>
          </form>

          <!-- Contenitore risultati: senza questo la ricerca non mostra nulla -->
          <div class="md-search__output">
            <div class="md-search__scrollwrap" data-md-scrollfix>
              <div class="md-search-result" data-md-component="search-result">
                <div class="md-search-result__meta">
                  Digita per iniziare la ricerca
                </div>
                <ol class="md-search-result__list" role="presentation"></ol>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</header>
