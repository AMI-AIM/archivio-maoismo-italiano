<!-- overrides/partials/footer.html -->
<footer class="md-footer">
  <div class="md-footer-meta md-typeset ami-footer">
    <div class="md-footer-meta__inner md-grid ami-footer__grid">
      <!-- Blocco principale: testo + icona Internet Archive -->
      <div class="ami-footer__brand">
        <div class="md-footer-copyright__text">
          Progetto a cura di <strong>Ivan Masci</strong>
        </div>
        <div class="md-footer-copyright__subtext">
          Dottore in Scienze della Storia e del Documento
        </div>
        <div class="md-footer-copyright__email">
          <a href="mailto:ivan.masci@outlook.com">ivan.masci@outlook.com</a>
        </div>
        <div class="ami-footer__social">
          <a href="https://archive.org/details/@ivan_masci/lists/1/archivio-del-maoismo-italiano"
             target="_blank"
             rel="noopener"
             title="Archivio del Maoismo Italiano su Internet Archive"
             class="ami-footer__social-link">
            <img src="{{ base_url }}/immagini/internet-archive-logo.png"
                 alt="Internet Archive"
                 class="ami-footer__ia-logo">
          </a>
        </div>
      </div>
      <!-- Colonna link: sezioni del sito -->
      <nav class="ami-footer__links" aria-label="Sezioni del sito">
        <span class="ami-footer__links-title">Sezioni</span>
        <div class="ami-footer__links-list">
          <a href="{{ base_url }}/">Home</a>
          <a href="{{ base_url }}/progetto/">Il progetto</a>
          <a href="{{ base_url }}/documenti/">Archivio</a>
          <a href="{{ base_url }}/persone/">Persone</a>
          <a href="{{ base_url }}/organizzazioni/">Organizzazioni</a>
        </div>
      </nav>
    </div>
    <!-- Divisore + barra finale centrata -->
    <div class="ami-footer__divider"></div>
    <div class="ami-footer__bottom">
      <span>&copy; {{ build_date_utc.strftime("%Y") if build_date_utc else "" }} Archivio del Maoismo Italiano</span>
    </div>
  </div>
</footer>
