site_name: AMI - Archivio del Maoismo Italiano
site_description: Documenti, periodici, opuscoli e fonti del movimento "filo-cinese" in Italia. Archivio digitale a cura di Ivan Masci.
site_author: Ivan Masci
site_url: https://ami-aim.github.io/archivio-maoismo-italiano/

docs_dir: build

theme:
  name: material
  custom_dir: overrides
  language: it
  font: false
  features:
    - header.autohide
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red
  logo: immagini/logo.webp
  favicon: immagini/favicon.png

extra_css:
  - stylesheets/extra.css
  - stylesheets/documenti.css
  - stylesheets/galleria.css

extra_javascript:
  - javascripts/hero-search.js
  - javascripts/documenti.js
  - javascripts/archivio-filtri.js
  - javascripts/galleria.js

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Il progetto: progetto.md
  - Archivio: documenti/
  - Persone: persone/
  - Organizzazioni: organizzazioni/

extra:
  homepage: /archivio-maoismo-italiano/
  generator: false
  social:
    - icon: fontawesome/brands/internet-archive
      link: https://archive.org/details/@ivan_masci/lists/1/archivio-del-maoismo-italiano
      name: Internet Archive