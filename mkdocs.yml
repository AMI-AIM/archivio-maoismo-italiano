site_name: AMI - Archivio del Maoismo Italiano
site_description: Documenti, periodici, opuscoli e fonti del movimento «filo-cinese» in Italia. Archivio digitale a cura di Ivan Masci.
site_author: Ivan Masci
site_url: https://ami-aim.github.io/archivio-maoismo-italiano/
docs_dir: build

theme:
  name: material
  custom_dir: overrides
  language: it
  font: false
  features:
    - header.autohide
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red
  logo: immagini/logo.webp
  favicon: favicon.ico

extra_css:
  - stylesheets/extra.css
  - stylesheets/documenti.css
  - stylesheets/galleria.css
  - stylesheets/archivio.css
  - stylesheets/argomenti.css
  - stylesheets/home.css
  - stylesheets/soggetti.css
  - stylesheets/soggetti-indice.css

# Script comuni a tutte le pagine. Quelli di una sola sezione (ricerca
# della home, schede documento, archivio, galleria) li carica
# overrides/main.html (blocco "scripts") solo dove servono.
extra_javascript:
  - javascripts/navigazione.js
  - javascripts/ia-status.js

plugins:
  - search

# Marca come cinese (lang="zh-Hans") il testo in caratteri cinesi.
hooks:
  - scripts/hooks/lingua_cinese.py
  - scripts/hooks/colophon.py

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Il progetto: progetto.md
  - Archivio:
    - Tutti i documenti: documenti/
    - Percorsi tematici: argomenti/
    - Galleria: galleria/  
  - Persone: persone/
  - Organizzazioni: organizzazioni/

extra:
  homepage: /archivio-maoismo-italiano/
  generator: false

