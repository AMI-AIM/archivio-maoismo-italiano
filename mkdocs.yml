site_name: AMI - Archivio del Maoismo Italiano
site_description: Catalogo digitale per la ricerca storica
site_author: Ivan Masci

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red
      
  logo: immagini/logo.png

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Il progetto: progetto.md
  - Archivio: documenti/
  - Organizzazioni: organizzazioni/
  - Persone: persone/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AMI-AIM/archivio-maoismo-italiano
      name: AMI su GitHub
  copyright: "&copy; 2026 AMI - Archivio del Maoismo Italiano"