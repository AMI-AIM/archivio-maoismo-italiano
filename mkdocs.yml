site_name: AMI - Archivio del Maoismo Italiano
site_description: Risorsa digitale per la ricerca storica sul maoismo in Italia
site_author: Ivan Masci
site_url: https://ami-aim.github.io/archivio-maoismo-italiano/

theme:
  name: material
  language: it
  features:
    - header.autohide          # Nasconde header su scroll (effetto elegante)
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red
  logo: immagini/logo.png
  favicon: immagini/favicon.png

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Il progetto: progetto.md
  - Archivio: documenti/
  - Persone: persone/
  - Organizzazioni: organizzazioni/

extra:
  homepage: /archivio-maoismo-italiano/   # fa linkare il logo alla home
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AMI-AIM/archivio-maoismo-italiano
      name: AMI su GitHub
  copyright: "&copy; 2026 AMI - Archivio del Maoismo Italiano"