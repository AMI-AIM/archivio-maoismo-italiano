site_name: AMI - Archivio del Maoismo Italiano
site_description: Risorsa digitale per la ricerca storica sul maoismo in Italia
site_author: Ivan Masci
site_url: https://ami-aim.github.io/archivio-maoismo-italiano/

theme:
  name: material
  language: it
  features:
    - header.autohide
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.tabs
  palette:
    # Tema chiaro (default)
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: "Passa al tema scuro"
    # Tema scuro
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: "Passa al tema chiaro"
  logo: immagini/logo.png
  favicon: immagini/favicon.png

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Il progetto: progetto.md
  - Archivio: documenti/
  - Persone: persone/
  - Organizzazioni: organizzazioni/

extra:
  homepage: /archivio-maoismo-italiano/
  generator: false