name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup cache AMI
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: ${{ runner.os }}-ami-cache-v2-${{ hashFiles('**/data/dati.xlsx', '**/scripts/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-ami-cache-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync static assets
        run: python scripts/sync_assets.py

      - name: Generate people pages
        run: python scripts/persone.py

      - name: Generate organization pages
        run: python scripts/org.py

      - name: Generate document schede
        run: python scripts/generatore.py

      - name: Build MkDocs
        run: mkdocs build

      - name: Force sitemap, robots and JSON into site/
        run: |
          echo "=== Copia forzata file SEO in site/ ==="
          cp -f build/sitemap.xml site/sitemap.xml
          cp -f build/sitemap.txt site/sitemap.txt
          cp -f build/robots.txt site/robots.txt
          cp -f build/documenti.json site/documenti.json
          cp -f build/soggetti.json site/soggetti.json
          echo "=== Verifica ==="
          ls -la site/sitemap.xml site/sitemap.txt site/robots.txt
          head -3 site/sitemap.xml
          head -3 site/sitemap.txt
          head -5 site/robots.txt

      - name: Verify critical files
        run: |
          test -f site/sitemap.xml || { echo "ERRORE: sitemap.xml mancante"; exit 1; }
          test -f site/sitemap.txt || { echo "ERRORE: sitemap.txt mancante"; exit 1; }
          test -f site/robots.txt || { echo "ERRORE: robots.txt mancante"; exit 1; }
          test -f site/index.html || { echo "ERRORE: index.html mancante"; exit 1; }
          echo "Tutti i file critici presenti"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages